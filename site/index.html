<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crucible</title>
  <meta name="description" content="A personal coding practice forge: problems from first steps to expert, in Python, C, C++, Rust, ESPresso and ARM64 assembly.">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('crucible.v1') || '{}').settings || {};
      const t = s.theme || 'system';
      const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Crucible home">
      <img src="img/icon.svg" alt="" width="26" height="26">
      <span>Crucible</span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/problems" data-nav="problems">Problems</a>
      <a href="#/cheatsheets" data-nav="cheatsheets">Cheat Sheets</a>
    </nav>
    <div class="topbar-right">
      <button class="status-pill" id="companion-pill" title="Runner status">
        <span class="dot"></span><span class="label">Checking…</span>
      </button>
      <a class="icon-btn" href="#/settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
    </div>
  </header>
  <main id="app" tabindex="-1"><div class="boot"><div class="spinner"></div></div></main>
  <div id="toast-root"></div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
